<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SadAge — Print Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #3f3f3f;
    --fg: #f0ede6;
    --muted: #c5b071;
    --accent: #c4b49a;
    --border: rgba(240,237,230,0.07);
    --border-h: rgba(240,237,230,0.18);
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 22px 40px 18px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .brand { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.1em; }
  .room-tag { font-size: 10px; color: var(--muted); letter-spacing: 0.22em; text-transform: uppercase; }

  .cap {
    font-size: 9px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .tog { display: flex; border: 1px solid var(--border); }
  .tog-btn {
    flex: 1; padding: 9px 12px;
    background: transparent; border: none; cursor: pointer;
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.16em; color: var(--muted);
    transition: all 0.18s; text-transform: uppercase;
  }
  .tog-btn:first-child { border-right: 1px solid var(--border); }
  .tog-btn.on { background: var(--fg); color: var(--bg); }

  .btn-r {
    width: 100%; padding: 11px;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.16em; text-transform: uppercase;
    cursor: pointer; transition: all 0.18s; margin-bottom: 8px;
  }
  .btn-r:hover { border-color: var(--border-h); color: var(--fg); }

  .btn-send {
    width: 100%; padding: 15px;
    background: var(--fg); border: none; color: var(--bg);
    font-family: 'Bebas Neue', sans-serif; font-size: 19px; letter-spacing: 0.12em;
    cursor: pointer; transition: background 0.18s, opacity 0.18s;
    opacity: 0.25; pointer-events: none;
  }
  .btn-send.on { opacity: 1; pointer-events: all; }
  .btn-send.on:hover { background: var(--accent); }

  /* ══ DESKTOP ══ */
  .workspace {
    display: grid;
    grid-template-columns: 1fr 320px;
    height: calc(100vh - 62px - 160px);
    min-height: 460px;
  }

  .stage {
    display: flex; align-items: center; justify-content: center;
    border-right: 1px solid var(--border); padding: 40px; position: relative;
  }

  /* ── Shirt container – holds photo + print layer ── */
  .shirt-wrap {
    position: relative;
    width: 340px; height: 400px;
    user-select: none;
  }

  /*
   * ── SHIRT IMAGES ──────────────────────────────────────────
   * Replace the src values below with your own PNG files.
   * Images should be PNG with transparent background.
   * Recommended size: 800×950px or similar portrait ratio.
   * ──────────────────────────────────────────────────────────
   */
  .shirt-img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    transition: opacity 0.35s ease;
    position: absolute;
    top: 0; left: 0;
  }

  .shirt-img-white { opacity: 1; }
  .shirt-img-black { opacity: 0; }

  .shirt-wrap.black .shirt-img-white { opacity: 0; }
  .shirt-wrap.black .shirt-img-black { opacity: 1; }
  .shirt-wrap.white .shirt-img-white { opacity: 1; }
  .shirt-wrap.white .shirt-img-black { opacity: 0; }

  /*
   * ── PRINT OVERLAY ─────────────────────────────────────────
   * This layer sits on top of the shirt image.
   * Position it over the chest area using top/left/transform.
   * Adjust these values to match your specific shirt photo.
   * ──────────────────────────────────────────────────────────
   */
  .print-layer {
    position: absolute;
    width: 140px; height: 140px;
    top: 50%;                         /* ← adjust to chest position */
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .print-layer.on { opacity: 1; }

  /* ── Print image inside overlay ── */
  .print-img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    position: absolute;
    top: 0; left: 0;
    transition: opacity 0.25s;
  }

  /* Show dark version on white shirt, light version on black shirt */
  .shirt-wrap.white .print-img-dark  { opacity: 1; }
  .shirt-wrap.white .print-img-light { opacity: 0; }
  .shirt-wrap.black .print-img-dark  { opacity: 0; }
  .shirt-wrap.black .print-img-light { opacity: 1; }

  .hint {
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%);
    font-size: 9px; color: var(--muted); letter-spacing: 0.22em;
    text-transform: uppercase; white-space: nowrap; transition: opacity 0.3s;
  }
  .hint.off { opacity: 0; }

  .panel {
    padding: 36px 28px 28px;
    display: flex; flex-direction: column; gap: 28px;
  }

  .code-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 60px; line-height: 1; letter-spacing: 0.04em; color: var(--fg); min-height: 62px;
  }
  .code-big.empty { color: var(--muted); font-size: 36px; line-height: 1.7; }

  .spacer { flex: 1; }

  /* Desktop library */
  .d-library { border-top: 1px solid var(--border); padding: 20px 40px 24px; background: #060606; }

  .lib-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }

  .lib-scroll {
    display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px;
    scrollbar-width: thin; scrollbar-color: #222 transparent;
  }

  .pthumb {
    flex-shrink: 0; width: 96px; height: 96px;
    border: 1px solid var(--border); background: #adadad; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: border-color 0.18s, background 0.18s; position: relative; overflow: hidden;
  }
  .pthumb:hover { border-color: var(--border-h); background: #151515; }
  .pthumb.sel { border-color: var(--fg); }

  /* Thumbnail preview image */
  .pthumb img {
    width: 64px; height: 64px;
    object-fit: contain;
    display: block;
  }

  .pthumb .pcode {
    font-size: 7.5px; letter-spacing: 0.12em; color: var(--muted);
    position: absolute; bottom: 6px;
  }

  /* Mobile-only hidden on desktop */
  .m-stage, .m-place, .m-selprint, .m-library, .m-btns { display: none; }

  /* ══ MODAL ══ */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.88);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.28s; z-index: 50;
  }
  .modal-bg.open { opacity: 1; pointer-events: all; }

  .modal {
    background: #0f0f0f; border: 1px solid rgba(240,237,230,0.12);
    padding: 36px; width: 460px; max-width: 92vw; max-height: 90vh; overflow-y: auto;
  }

  .m-title { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 0.08em; margin-bottom: 4px; }
  .m-sub { font-size: 9px; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 28px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .ff { display: flex; flex-direction: column; gap: 5px; }
  .ff.full { grid-column: 1 / -1; }
  .ff label { font-size: 8px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }

  .ff input, .ff select, .ff textarea {
    background: #060606; border: 1px solid var(--border); color: var(--fg);
    font-family: 'Space Mono', monospace; font-size: 11px; padding: 9px 10px;
    outline: none; width: 100%; transition: border-color 0.18s; appearance: none;
  }
  .ff input:focus, .ff select:focus, .ff textarea:focus { border-color: rgba(240,237,230,0.28); }
  .ff textarea { resize: vertical; min-height: 72px; }
  .ff select { cursor: pointer; }
  select option { background: #0f0f0f; }

  .m-actions { display: flex; gap: 10px; margin-top: 22px; }

  .btn-confirm {
    flex: 1; padding: 13px; background: var(--fg); border: none; color: var(--bg);
    font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 0.12em;
    cursor: pointer; transition: background 0.18s;
  }
  .btn-confirm:hover { background: var(--accent); }

  .btn-cx {
    padding: 13px 18px; background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.16em;
    text-transform: uppercase; cursor: pointer; transition: all 0.18s;
  }
  .btn-cx:hover { border-color: var(--border-h); color: var(--fg); }

  /* ══ SENT ══ */
  .sent {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; opacity: 0; pointer-events: none; transition: opacity 0.38s; z-index: 100;
  }
  .sent.show { opacity: 1; pointer-events: all; }
  .sent-big { font-family: 'Bebas Neue', sans-serif; font-size: 90px; letter-spacing: 0.04em; line-height: 1; }
  .sent-note { font-size: 10px; color: var(--muted); letter-spacing: 0.22em; text-transform: uppercase; }
  .sent-ref { font-size: 10px; color: var(--accent); letter-spacing: 0.14em; margin-top: 4px; }
  .sent-back {
    margin-top: 28px; background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase; padding: 11px 22px; cursor: pointer; transition: all 0.18s;
  }
  .sent-back:hover { border-color: var(--border-h); color: var(--fg); }

  /* ════════════════════════
     MOBILE  ≤ 720px
  ════════════════════════ */
  @media (max-width: 720px) {
    header { padding: 16px 20px; }
    .brand { font-size: 24px; }
    .room-tag { font-size: 9px; letter-spacing: 0.3em; }
    .workspace, .d-library { display: none; }
    .m-stage, .m-place, .m-selprint, .m-library, .m-btns { display: block; }
 
    /* Stage — grey background matching mockup */
    .m-stage {
      padding: 18px 16px 20px;
      background: #2e2e2e;
      border-bottom: 1px solid rgba(0,0,0,0.3);
    }
    .m-stage .cap { margin-bottom: 14px; color: #a09e98; }
 
    .m-stage-row { display: flex; align-items: flex-start; gap: 10px; }
 
    /* Swatches — smaller, tight column */
    .m-swatches { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; flex-shrink: 0; }
 
    .mswatch { width: 32px; height: 32px; cursor: pointer; border: 2px solid rgba(240,237,230,0.15); transition: border-color 0.18s; }
    .mswatch-w { background: #f4f1eb; }
    .mswatch-b { background: #131313; }
    .mswatch.on { border-color: var(--fg); }
 
    /* Shirt — fills remaining width, taller */
    .m-shirt-area { flex: 1; position: relative; display: flex; justify-content: center; }
 
    .m-shirt-wrap { position: relative; width: 100%; height: 380px; user-select: none; }
    .m-shirt-wrap .shirt-img { width: 100%; height: 100%; object-fit: contain; display: block; position: absolute; top: 0; left: 0; transition: opacity 0.35s; }
    .m-shirt-wrap .shirt-img-white { opacity: 1; }
    .m-shirt-wrap .shirt-img-black { opacity: 0; }
    .m-shirt-wrap.black .shirt-img-white { opacity: 0; }
    .m-shirt-wrap.black .shirt-img-black { opacity: 1; }
 
    .m-shirt-wrap .print-layer { width: 140px; height: 140px; top: 50%; }
    .m-shirt-wrap.white .print-img-dark  { opacity: 1; }
    .m-shirt-wrap.white .print-img-light { opacity: 0; }
    .m-shirt-wrap.black .print-img-dark  { opacity: 0; }
    .m-shirt-wrap.black .print-img-light { opacity: 1; }
 
    .m-hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 8px; color: rgba(160,158,152,0.7); letter-spacing: 0.22em;
      text-transform: uppercase; white-space: nowrap; transition: opacity 0.3s;
    }
    .m-hint.off { opacity: 0; }
 
    /* Placement — compact inline row, still on grey bg */
    .m-place {
      padding: 10px 16px 14px;
      background: #2e2e2e;
      border-bottom: 1px solid rgba(0,0,0,0.35);
    }
    .m-place-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .m-place-inner .cap { margin: 0; white-space: nowrap; color: #a09e98; }
    .m-place-tog { flex: 0 0 auto; width: 200px; }
    .m-place .tog { border-color: rgba(240,237,230,0.15); }
    .m-place .tog-btn { padding: 8px 10px; font-size: 10px; }
    .m-place .tog-btn:first-child { border-right-color: rgba(240,237,230,0.15); }
 
    /* Selected print */
    .m-selprint { padding: 20px 16px; background: #060606; border-bottom: 1px solid var(--border); }
    .m-code {
      font-family: 'Bebas Neue', sans-serif; font-size: 56px; line-height: 1;
      letter-spacing: 0.04em; color: var(--fg); min-height: 58px;
    }
    .m-code.empty { color: var(--muted); font-size: 28px; line-height: 2; }
 
    /* Library */
    .m-library { padding: 20px 16px 0; background: #060606; border-top: 1px solid var(--border); }
    .m-lib-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .m-lib-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .m-lib-scroll::-webkit-scrollbar { display: none; }
 
    /* Thumbnails — large, ~45vw, artwork fills the tile */
    .m-pthumb {
      flex-shrink: 0;
      width: calc(47vw - 12px);
      height: calc(47vw - 12px);
      border: 1px solid var(--border); background: #dbdbdb; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: border-color 0.18s; position: relative; overflow: hidden;
    }
    .m-pthumb:active { opacity: 0.85; }
    .m-pthumb.sel { border-color: var(--fg); border-width: 2px; }
    /* Image fills most of the tile */
    .m-pthumb img {
      width: 100%; height: calc(100%);
      object-fit: cover; display: block;
    }
    .m-pthumb .pcode {
      font-size: 9px; letter-spacing: 0.14em; color: var(--muted);
      position: absolute; bottom: 8px;
    }
 
    .m-scroll-track { height: 2px; background: rgba(240,237,230,0.06); margin: 12px 0 0; position: relative; overflow: hidden; }
    .m-scroll-thumb { position: absolute; left: 0; top: 0; height: 100%; width: 30%; background: rgba(240,237,230,0.22); transition: transform 0.08s linear; }
 
    /* Bottom buttons */
    .m-btns { padding: 12px 16px 36px; display: flex; flex-direction: column; gap: 10px; background: #060606; }
    .m-btns .btn-r { margin-bottom: 0; padding: 15px; font-size: 11px; }
    /* Active send button: cream fill, dark text — matching mockup */
    .m-btns .btn-send { padding: 20px; font-size: 24px; background: #1a1a1a; }
    .m-btns .btn-send.on { background: #f0ede6; color: #0a0a0a; }
    .m-btns .btn-send.on:active { background: var(--accent); }
  }
</style>
</head>
<body>

<header>
  <span class="brand">SadAge</span>
  <span class="room-tag">Print Room</span>
</header>

<!-- ════ DESKTOP ════ -->
<div class="workspace">
  <div class="stage">
    <div class="shirt-wrap white" id="dShirtWrap">

      <!--
        ╔══════════════════════════════════════════════════════╗
        ║  SHIRT IMAGES — replace src with your PNG files     ║
        ║  Put your files in the same folder as this HTML,    ║
        ║  or use a subfolder: e.g. images/tshirt-white.png   ║
        ╚══════════════════════════════════════════════════════╝
      -->
      <img class="shirt-img shirt-img-white" src="images/tshirt-white.png" alt="White T-shirt">
      <img class="shirt-img shirt-img-black" src="images/tshirt-black.png" alt="Black T-shirt">

      <div class="print-layer" id="dPrintLayer">
        <!--
          Two versions of each print sit here.
          dark  = shown on white shirt (your print in dark ink)
          light = shown on black shirt (your print in light/white ink)
        -->
        <img class="print-img print-img-dark"  id="dPrintDark"  src="" alt="">
        <img class="print-img print-img-light" id="dPrintLight" src="" alt="">
      </div>

      <span class="hint" id="dHint">← select a print</span>
    </div>
  </div>

  <div class="panel">
    <div>
      <div class="cap">Selected print</div>
      <div class="code-big empty" id="dCode">—</div>
    </div>
    <div>
      <div class="cap">Garment color</div>
      <div class="tog">
        <button class="tog-btn on" id="dBW" onclick="setColor('white')">White</button>
        <button class="tog-btn" id="dBB" onclick="setColor('black')">Black</button>
      </div>
    </div>
    <div>
      <div class="cap">Placement</div>
      <div class="tog">
        <button class="tog-btn on" id="dBFr" onclick="setPlace('front')">Front</button>
        <button class="tog-btn" id="dBBk" onclick="setPlace('back')">Back</button>
      </div>
    </div>
    <div class="spacer"></div>
    <div>
      <button class="btn-r" onclick="reset()">Reset</button>
      <button class="btn-send" id="dBtnSend" onclick="openModal()">Ask SadAge to print this →</button>
    </div>
  </div>
</div>

<div class="d-library">
  <div class="lib-head">
    <span class="cap" style="margin:0">Print archive</span>
    <span style="font-size:9px;color:var(--muted);letter-spacing:.12em">— scroll →</span>
  </div>
  <div class="lib-scroll" id="dLibScroll"></div>
</div>


<!-- ════ MOBILE ════ -->
<div class="m-stage">
  <div class="cap">Garment Color</div>
  <div class="m-stage-row">
    <div class="m-swatches">
      <div class="mswatch mswatch-w on" id="mSwW" onclick="setColor('white')"></div>
      <div class="mswatch mswatch-b" id="mSwB" onclick="setColor('black')"></div>
    </div>
    <div class="m-shirt-area">
      <div class="m-shirt-wrap white" id="mShirtWrap">
        <img class="shirt-img shirt-img-white" src="images/tshirt-white.png" alt="White T-shirt">
        <img class="shirt-img shirt-img-black" src="images/tshirt-black.png" alt="Black T-shirt">
        <div class="print-layer" id="mPrintLayer">
          <img class="print-img print-img-dark"  id="mPrintDark"  src="" alt="">
          <img class="print-img print-img-light" id="mPrintLight" src="" alt="">
        </div>
        <span class="m-hint" id="mHint">← SELECT A PRINT</span>
      </div>
    </div>
  </div>
  <div class="m-place">
    <div class="m-place-inner">
      <span class="cap" style="margin:0">Placement</span>
      <div class="tog m-place-tog">
        <button class="tog-btn on" id="mBFr" onclick="setPlace('front')">Front</button>
        <button class="tog-btn" id="mBBk" onclick="setPlace('back')">Back</button>
      </div>
    </div>
  </div>
</div>
 
<div class="m-library">
  <div class="m-lib-head">
    <span class="cap" style="margin:0">Print Archive</span>
    <span style="font-size:9px;color:var(--muted);letter-spacing:.12em">— scroll →</span>
  </div>
  <div class="m-lib-scroll" id="mLibScroll"></div>
  <div class="m-scroll-track"><div class="m-scroll-thumb" id="mScrollThumb"></div></div>
</div>
 
<div class="m-selprint">
  <div class="cap">Selected Print</div>
  <div class="m-code empty" id="mCode">—</div>
</div>
 
<div class="m-btns">
  <button class="btn-r" onclick="reset()">Reset</button>
  <button class="btn-send" id="mBtnSend" onclick="openModal()">Ask SadAge to print this →</button>
</div>


<!-- ════ MODAL ════ -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="m-title">Print Request</div>
    <div class="m-sub">SadAge Print Room — your selection</div>
    <div class="form-grid">
      <div class="ff"><label>Print code</label><input id="fPrint" type="text" readonly></div>
      <div class="ff"><label>T-shirt color</label><input id="fColor" type="text" readonly></div>
    </div>
    <div class="form-grid">
      <div class="ff">
        <label>Size</label>
        <select id="fSize"><option>XS</option><option>S</option><option selected>M</option><option>L</option><option>XL</option><option>XXL</option></select>
      </div>
      <div class="ff"><label>Placement</label><input id="fPlace" type="text" readonly></div>
    </div>
    <div class="form-grid"><div class="ff full"><label>Your name</label><input id="fName" type="text" placeholder="—"></div></div>
    <div class="form-grid"><div class="ff full"><label>Contact (email or Instagram)</label><input id="fContact" type="text" placeholder="—"></div></div>
    <div class="form-grid"><div class="ff full"><label>Comment</label><textarea id="fComment" placeholder="Any notes, references, adjustments..."></textarea></div></div>
    <div class="m-actions">
      <button class="btn-confirm" onclick="send()">Send Request</button>
      <button class="btn-cx" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="sent" id="sentScreen">
  <div class="sent-big">Received.</div>
  <div class="sent-note">SadAge will be in touch</div>
  <div class="sent-ref" id="sentRef"></div>
  <button class="sent-back" onclick="hideSent()">← back to print room</button>
</div>


<script>
/*
  ╔══════════════════════════════════════════════════════════════════╗
  ║  PRINTS — ADD YOUR OWN DESIGNS HERE                             ║
  ║                                                                  ║
  ║  Each print needs:                                               ║
  ║    code  — the print reference shown in the UI (e.g. 'SA-037') ║

let sel = null, color = 'white', place = 'front';

/* Build libraries */
['dLibScroll', 'mLibScroll'].forEach((id, idx) => {
  const isMob = idx === 1;
  const el = document.getElementById(id);
  PRINTS.forEach(p => {
    const t = document.createElement('div');
    t.className = isMob ? 'm-pthumb' : 'pthumb';
    t.dataset.code = p.code;
    t.innerHTML = `<img src="${p.thumb}" alt="${p.code}"><span class="pcode">${p.code}</span>`;
    t.onclick = () => pick(p);
    el.appendChild(t);
  });
});

/* Mobile scroll indicator */
const mls = document.getElementById('mLibScroll');
mls.addEventListener('scroll', () => {
  const max = mls.scrollWidth - mls.clientWidth;
  if (max <= 0) return;
  document.getElementById('mScrollThumb').style.transform =
    `translateX(${(mls.scrollLeft / max) * (mls.offsetWidth * 0.7)}px)`;
});

function pick(p) {
  sel = p;

  /* Desktop */
  document.querySelectorAll('.pthumb').forEach(t => t.classList.toggle('sel', t.dataset.code === p.code));
  document.getElementById('dPrintDark').src  = p.dark;
  document.getElementById('dPrintLight').src = p.light;
  document.getElementById('dPrintLayer').classList.add('on');
  const dc = document.getElementById('dCode');
  dc.textContent = p.code; dc.classList.remove('empty');
  document.getElementById('dBtnSend').classList.add('on');
  document.getElementById('dHint').classList.add('off');

  /* Mobile */
  document.querySelectorAll('.m-pthumb').forEach(t => t.classList.toggle('sel', t.dataset.code === p.code));
  document.getElementById('mPrintDark').src  = p.dark;
  document.getElementById('mPrintLight').src = p.light;
  document.getElementById('mPrintLayer').classList.add('on');
  const mc = document.getElementById('mCode');
  mc.textContent = p.code; mc.classList.remove('empty');
  document.getElementById('mBtnSend').classList.add('on');
  document.getElementById('mHint').classList.add('off');
}

function setColor(c) {
  color = c;
  document.getElementById('dShirtWrap').className = 'shirt-wrap ' + c;
  document.getElementById('dBW').className = 'tog-btn' + (c==='white'?' on':'');
  document.getElementById('dBB').className = 'tog-btn' + (c==='black'?' on':'');
  document.getElementById('mShirtWrap').className = 'm-shirt-wrap ' + c;
  document.getElementById('mSwW').className = 'mswatch mswatch-w' + (c==='white'?' on':'');
  document.getElementById('mSwB').className = 'mswatch mswatch-b' + (c==='black'?' on':'');
}

function setPlace(p) {
  place = p;
  ['dBFr','mBFr'].forEach(id => document.getElementById(id).className = 'tog-btn' + (p==='front'?' on':''));
  ['dBBk','mBBk'].forEach(id => document.getElementById(id).className = 'tog-btn' + (p==='back'?' on':''));
}

function reset() {
  sel = null;
  document.querySelectorAll('.pthumb,.m-pthumb').forEach(t => t.classList.remove('sel'));
  ['dPrintLayer','mPrintLayer'].forEach(id => document.getElementById(id).classList.remove('on'));
  ['dCode','mCode'].forEach(id => { const e = document.getElementById(id); e.textContent='—'; e.classList.add('empty'); });
  ['dBtnSend','mBtnSend'].forEach(id => document.getElementById(id).classList.remove('on'));
  ['dHint','mHint'].forEach(id => document.getElementById(id).classList.remove('off'));
}

function openModal() {
  if (!sel) return;
  document.getElementById('fPrint').value = sel.code;
  document.getElementById('fColor').value = color.toUpperCase();
  document.getElementById('fPlace').value = (place==='front'?'Front':'Back') + ' / Center';
  document.getElementById('modalBg').classList.add('open');
}

function closeModal() { document.getElementById('modalBg').classList.remove('open'); }

function buildMessage() {
  const name    = document.getElementById('fName').value || '—';
  const contact = document.getElementById('fContact').value || '—';
  const size    = document.getElementById('fSize').value;
  const comment = document.getElementById('fComment').value || '—';
  return `Hi SadAge! Print request:
 
Print:     ${sel.code}
T-shirt:   ${color.toUpperCase()}
Size:      ${size}
Placement: ${place} / center
—
From:    ${name}
IG:      ${contact}
Comment: ${comment}`;
}
 
let lastMessage = '';
 
function send() {
  lastMessage = buildMessage();
  navigator.clipboard.writeText(lastMessage).catch(() => {
    /* fallback for browsers that block clipboard without interaction */
    const ta = document.createElement('textarea');
    ta.value = lastMessage;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });

	const size = document.getElementById('fSize').value;
  closeModal();
 
  document.getElementById('sentRef').textContent = `${sel.code} · ${color.toUpperCase()} · ${size}`;
  document.getElementById('sentScreen').classList.add('show');
 
  /* ── Replace with your SadAge Instagram username ── */
  setTimeout(() => window.open('https://ig.me/m/sad_age.enterprise', '_blank'), 600);
}
 
function copyAgain() {
  if (!lastMessage) return;
  navigator.clipboard.writeText(lastMessage).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = lastMessage; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  });
  const btn = document.getElementById('btnCopyAgain');
  btn.textContent = 'Copied ✓';
  setTimeout(() => { btn.textContent = 'Copy again'; }, 2000);
}

function hideSent() { document.getElementById('sentScreen').classList.remove('show'); }

document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target === document.getElementById('modalBg')) closeModal();
});
