<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>People — SadAge</title>
  <meta name="description" content="People, a photo archive by SadAge.">
  <link rel="canonical" href="https://sadage.com/people/">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/people/people.css?v=3">
  <link rel="stylesheet" href="/assets/legal.css">
  <script defer src="/people/people.js?v=2"></script>

</head>
<body>
  <nav class="albums" id="album-list" aria-label="Photo albums"></nav>
  <details class="site-menu">
    <summary aria-label="Site index" title="Index">+</summary>
    <nav aria-label="SadAge index">
      <a href="/">Home</a>
      <a href="/meta-second/">Meta Secondhand</a>
