<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SadAge — Print Catalog</title>
<meta name="description" content="Full catalog of SadAge screen prints. Browse the archive and try any print in the Print Room.">
<link rel="canonical" href="https://sadage.com/prints/">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    color: #f0ede6;
    font-family: 'Space Mono', monospace;
    user-select: none;
  }

  /* ── Header ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 30;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 12px;
    background: linear-gradient(to bottom, rgba(10,10,10,0.9) 0%, transparent 100%);
  }

  .h-left { display: flex; flex-direction: column; gap: 2px; }
  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 0.1em; line-height: 1;
    text-decoration: none; color: #f0ede6;
  }
  .page-tag { font-size: 8px; color: #c4b49a; letter-spacing: 0.24em; text-transform: uppercase; }

  .h-right { display: flex; align-items: center; gap: 24px; }

  .h-link {
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: #5e5c56; text-decoration: none; transition: color 0.15s;
  }
  .h-link:hover { color: #f0ede6; }

  .h-count {
    font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #3a3a38;
  }

  .h-btn {
    background: transparent;
    border: 1px solid rgba(240,237,230,0.12);
    color: #5e5c56;
    font-family: 'Space Mono', monospace;
    font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .h-btn:hover { border-color: rgba(240,237,230,0.3); color: #f0ede6; }
  .h-btn.active { border-color: rgba(240,237,230,0.5); color: #f0ede6; background: rgba(240,237,230,0.04); }

  /* ── Particle field ── */
  #field {
    position: fixed;
    inset: 0;
    cursor: default;
  }

  /* ── Each particle ── */
  .particle {
    position: absolute;
    cursor: pointer;
    transform-origin: center center;
    will-change: transform;
    transition: box-shadow 0.2s, opacity 0.3s;
  }

  .particle:hover {
    z-index: 10 !important;
  }

  .particle:hover .p-img-wrap {
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(240,237,230,0.3);
  }

  .p-img-wrap {
    width: 100%; height: 100%;
    background: #f4f1eb;
    padding: 8%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    transition: box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  .p-img-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }

  .p-code {
    position: absolute;
    bottom: 4px; left: 0; right: 0;
    text-align: center;
    font-size: 6px;
    letter-spacing: 0.12em;
    color: #999;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* Dim all particles when viewer is open */
  body.viewing .particle {
    opacity: 0.18;
    pointer-events: none;
  }

  /* ── Viewer ── */
  .viewer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: background 0.3s;
  }

  .viewer-overlay.open {
    pointer-events: all;
    background: rgba(0,0,0,0.15);
  }

  .viewer-box {
    display: flex;
    align-items: stretch;
    background: #0e0e0e;
    border: 1px solid rgba(240,237,230,0.1);
    opacity: 0;
    transform: scale(0.92);
    transition: opacity 0.28s ease, transform 0.28s ease;
    max-width: 90vw;
    max-height: 80vh;
  }

  .viewer-overlay.open .viewer-box {
    opacity: 1;
    transform: scale(1);
  }

  /* Image panel — 33vmin × 33vmin */
  .viewer-img-panel {
    width: 33vmin;
    height: 33vmin;
    flex-shrink: 0;
    background: #f4f1eb;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8%;
  }

  .viewer-img-panel img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Info panel */
  .viewer-info {
    width: 200px;
    padding: 24px 20px;
    border-left: 1px solid rgba(240,237,230,0.07);
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-shrink: 0;
  }

  .v-counter {
    font-size: 8px; letter-spacing: 0.2em;
    color: #3a3a38; text-transform: uppercase;
  }

  .v-code {
    font-size: 8px; letter-spacing: 0.22em;
    color: #5e5c56; text-transform: uppercase;
  }

  .v-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 0.05em; line-height: 1.05;
    color: #f0ede6;
    flex: 1;
  }

  .v-desc {
    font-size: 8px; line-height: 1.8;
    color: #5e5c56; letter-spacing: 0.04em;
  }

  /* Nav arrows */
  .v-nav {
    display: flex;
    gap: 8px;
  }

  .v-nav-btn {
    flex: 1; padding: 10px 6px;
    background: transparent;
    border: 1px solid rgba(240,237,230,0.1);
    color: #5e5c56;
    font-family: 'Space Mono', monospace;
    font-size: 14px; line-height: 1;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .v-nav-btn:hover { border-color: rgba(240,237,230,0.25); color: #f0ede6; }

  .v-try {
    display: block; padding: 12px 8px;
    background: #f0ede6; border: none;
    color: #0a0a0a;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px; letter-spacing: 0.1em;
    text-decoration: none; text-align: center;
    cursor: pointer; transition: background 0.15s;
  }
  .v-try:hover { background: #c4b49a; }

  .v-close {
    background: transparent;
    border: 1px solid rgba(240,237,230,0.07);
    color: #3a3a38;
    font-family: 'Space Mono', monospace;
    font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase;
    padding: 8px; cursor: pointer; transition: all 0.15s;
    width: 100%;
  }
  .v-close:hover { border-color: rgba(240,237,230,0.18); color: #f0ede6; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    .viewer-box { flex-direction: column; max-height: 85vh; overflow-y: auto; }
    .viewer-img-panel { width: 75vmin; height: 75vmin; align-self: center; }
    .viewer-info { width: 100%; border-left: none; border-top: 1px solid rgba(240,237,230,0.07); }
    .h-count { display: none; }
    .h-btn { padding: 5px 8px; font-size: 7px; }
    .h-link { display: none; }
  }

  /* Hint text in center */
  .field-hint {
    position: fixed;
    bottom: 28px; left: 50%; transform: translateX(-50%);
    font-size: 8px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #2a2a28;
    pointer-events: none;
    transition: opacity 0.5s;
    white-space: nowrap;
  }
  .field-hint.hidden { opacity: 0; }
</style>
</head>
<body>

<header>
  <div class="h-left">
    <a class="brand" href="/">SadAge</a>
    <span class="page-tag">Print Catalog</span>
  </div>
  <div class="h-right">
    <span class="h-count" id="hCount"></span>
    <button class="h-btn" id="btnRandom" onclick="randomParticle()">Random</button>
    <button class="h-btn" id="btnGrid" onclick="toggleGrid()">Grid</button>
    <a class="h-link" href="/print-room/">Print Room →</a>
    <a class="h-link" href="/meta-second/">Secondhand →</a>
  </div>
</header>

<div id="field"></div>

<div class="field-hint" id="hint">Click any print to open</div>

<!-- Viewer -->
<div class="viewer-overlay" id="viewerOverlay">
  <div class="viewer-box" id="viewerBox">
    <div class="viewer-img-panel">
      <img id="vImg" src="" alt="">
    </div>
    <div class="viewer-info">
      <div class="v-counter" id="vCounter"></div>
      <div class="v-code" id="vCode"></div>
      <div class="v-name" id="vName"></div>
      <div class="v-desc" id="vDesc"></div>
      <div class="v-nav">
        <button class="v-nav-btn" onclick="navigate(-1)">←</button>
        <button class="v-nav-btn" onclick="navigate(1)">→</button>
      </div>
      <a class="v-try" href="/print-room/" id="vTry">Try in Print Room →</a>
      <button class="v-close" onclick="closeViewer()">Close · Esc</button>
    </div>
  </div>
</div>

<script>
/*
  ╔═══════════════════════════════════════════════════════╗
  ║  PRINTS — add your entries here                      ║
  ║  img  → path to dark ink version of the print       ║
  ║  name → optional, shown in viewer                   ║
  ║  desc → optional short text                         ║
  ╚═══════════════════════════════════════════════════════╝
*/
const PRINTS = [
  { code: 'SA-001', name: '', desc: '', img: 'prints/live/lp-001.jpg' },
  { code: 'SA-002', name: '', desc: '', img: 'prints/live/lp-002.jpg' },
  { code: 'SA-003', name: '', desc: '', img: 'prints/live/lp-003.jpg' },
  { code: 'SA-004', name: '', desc: '', img: 'prints/live/lp-004.jpg' },
  { code: 'SA-005', name: '', desc: '', img: 'prints/live/lp-005.jpg' },
  { code: 'SA-006', name: '', desc: '', img: 'prints/live/lp-006.jpg' },
  { code: 'SA-007', name: '', desc: '', img: 'prints/live/lp-007.jpg' },
  { code: 'SA-008', name: '', desc: '', img: 'prints/live/lp-008.jpg' },
  { code: 'SA-009', name: '', desc: '', img: 'prints/live/lp-009.jpg' },
  { code: 'SA-010', name: '', desc: '', img: 'prints/live/lp-010.jpg' },
  { code: 'SA-011', name: '', desc: '', img: 'prints/live/lp-011.jpg' },
  { code: 'SA-012', name: '', desc: '', img: 'prints/live/lp-012.jpg' },
  { code: 'SA-013', name: '', desc: '', img: 'prints/live/lp-013.jpg' },
  { code: 'SA-014', name: '', desc: '', img: 'prints/live/lp-014.jpg' },
  { code: 'SA-015', name: '', desc: '', img: 'prints/live/lp-015.jpg' },
  { code: 'SA-016', name: '', desc: '', img: 'prints/live/lp-016.jpg' },
  { code: 'SA-017', name: '', desc: '', img: 'prints/live/lp-017.jpg' },
  { code: 'SA-018', name: '', desc: '', img: 'prints/live/lp-018.jpg' },
  { code: 'SA-019', name: '', desc: '', img: 'prints/live/lp-019.jpg' },
  { code: 'SA-020', name: '', desc: '', img: 'prints/live/lp-020.jpg' },
  { code: 'SA-021', name: '', desc: '', img: 'prints/live/lp-021.jpg' },
  { code: 'SA-022', name: '', desc: '', img: 'prints/live/lp-022.jpg' },
  { code: 'SA-023', name: '', desc: '', img: 'prints/live/lp-023.jpg' },
  { code: 'SA-024', name: '', desc: '', img: 'prints/live/lp-024.jpg' },
  { code: 'SA-025', name: '', desc: '', img: 'prints/live/lp-025.jpg' }
];

document.getElementById('hCount').textContent = PRINTS.length + ' prints';

/* ════ PARTICLE SYSTEM ════ */
const field  = document.getElementById('field');
const n      = PRINTS.length;
let   W      = window.innerWidth;
let   H      = window.innerHeight;
let   cx     = W / 2;
let   cy     = H / 2;
let   raf;
let   startT = null;
let   currentIndex = -1;
let   isGrid = false;

/* Per-particle params */
const particles = PRINTS.map((p, i) => {
  /* Evenly distribute angles + small random jitter */
  const baseAngle  = (i / n) * Math.PI * 2;
  const jitter     = (Math.random() - 0.5) * (Math.PI * 2 / n) * 0.5;
  const angle      = baseAngle + jitter;

  /* Orbit radii — varied per particle for cloud feel */
  const rxBase     = Math.min(W, H) * 0.34;
  const ryBase     = Math.min(W, H) * 0.26;
  const rxVar      = (Math.random() - 0.5) * rxBase * 0.36;
  const ryVar      = (Math.random() - 0.5) * ryBase * 0.36;

  /* Speed — slightly varied, all same direction (clockwise) */
  const speed      = 0.00022 + (Math.random() - 0.5) * 0.00006;

  /* Visual rotation — static tilt */
  const tilt       = (Math.random() - 0.5) * 22;

  /* Size — slightly varied */
  const size       = 76 + Math.random() * 36;

  /* Wobble — secondary sine oscillation for organic feel */
  const wAmp       = 18 + Math.random() * 22;   /* px */
  const wFreq      = 0.0004 + Math.random() * 0.0003;
  const wPhase     = Math.random() * Math.PI * 2;

  /* Build DOM element */
  const el = document.createElement('div');
  el.className = 'particle';
  el.style.width  = size + 'px';
  el.style.height = size + 'px';
  el.innerHTML = `
    <div class="p-img-wrap">
      <img src="${p.img}" alt="${p.code}" loading="lazy">
      <span class="p-code">${p.code}</span>
    </div>`;

  el.addEventListener('click', e => { e.stopPropagation(); openViewer(i); });
  field.appendChild(el);

  return { el, p, angle, rx: rxBase + rxVar, ry: ryBase + ryVar,
           speed, tilt, size, wAmp, wFreq, wPhase };
});

/* ── Animation loop ── */
function tick(ts) {
  if (!startT) startT = ts;
  const t = ts - startT;

  particles.forEach((par, i) => {
    par.angle += par.speed;

    /* Primary elliptical orbit (clockwise on screen) */
    const ox = cx + par.rx * Math.cos(par.angle);
    const oy = cy + par.ry * Math.sin(par.angle);

    /* Secondary wobble */
    const wx = par.wAmp * Math.sin(t * par.wFreq + par.wPhase);
    const wy = par.wAmp * Math.cos(t * par.wFreq + par.wPhase * 1.3);

    const x  = ox + wx - par.size / 2;
    const y  = oy + wy - par.size / 2;

    /* z-index by y position: lower = closer */
    const zBase = Math.round(((oy + par.ry) / (par.ry * 2)) * 8);
    par.el.style.zIndex  = zBase;

    /* Subtle scale by y depth */
    const depthScale = 0.82 + 0.18 * ((oy - (cy - par.ry)) / (par.ry * 2));

    par.el.style.transform =
      `translate(${x}px, ${y}px) rotate(${par.tilt}deg) scale(${depthScale})`;
  });

  raf = requestAnimationFrame(tick);
}

requestAnimationFrame(tick);

/* ── Resize ── */
window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  cx = W / 2; cy = H / 2;
  particles.forEach(par => {
    const rxBase = Math.min(W, H) * 0.34;
    const ryBase = Math.min(W, H) * 0.26;
    par.rx = rxBase + (Math.random() - 0.5) * rxBase * 0.36;
    par.ry = ryBase + (Math.random() - 0.5) * ryBase * 0.36;
  });
  if (isGrid) {
    particles.forEach(par => { par.el.style.transition = ''; });
    arrangeGrid();
  }
});

/* ════ RANDOM ════ */
function randomParticle() {
  const idx = Math.floor(Math.random() * PRINTS.length);
  openViewer(idx);
}

/* ════ GRID ════ */
function toggleGrid() {
  isGrid = !isGrid;
  const btn     = document.getElementById('btnGrid');
  const fieldEl = document.getElementById('field');

  if (isGrid) {
    cancelAnimationFrame(raf);

    /* Enable vertical scroll */
    document.documentElement.style.overflow = 'auto';
    document.body.style.overflow            = 'auto';
    document.body.style.height              = 'auto';

    /* Field becomes a tall scrollable container */
    fieldEl.style.position = 'relative';
    fieldEl.style.inset    = 'auto';

    particles.forEach(par => {
      par.el.style.transition = 'transform 0.55s cubic-bezier(0.4, 0, 0.2, 1)';
    });

    arrangeGrid();
    btn.textContent = 'Float';
    btn.classList.add('active');

  } else {
    /* Restore fixed field */
    fieldEl.style.position = 'fixed';
    fieldEl.style.inset    = '0';
    fieldEl.style.height   = '';

    /* Disable scroll */
    document.documentElement.style.overflow = '';
    document.body.style.overflow            = '';
    document.body.style.height              = '';
    window.scrollTo(0, 0);

    particles.forEach(par => {
      par.el.style.transition = '';
    });

    btn.textContent = 'Grid';
    btn.classList.remove('active');

    setTimeout(() => {
      startT = null;
      raf = requestAnimationFrame(tick);
    }, 60);
  }
}

function arrangeGrid() {
  const COLS    = 3;
  const cellW   = Math.floor(W / COLS);
  const cellH   = cellW;          /* square cells — big */
  const rows    = Math.ceil(n / COLS);
  const totalH  = rows * cellH + 60;   /* 60px header clearance */
  const padding = cellW * 0.07;

  /* Set field height for scroll */
  document.getElementById('field').style.height = totalH + 'px';

  particles.forEach((par, i) => {
    const col   = i % COLS;
    const row   = Math.floor(i / COLS);
    const cellX = col * cellW;
    const cellY = 60 + row * cellH;

    /* Center image in cell */
    const avail = Math.min(cellW, cellH) - padding * 2;
    const scale = avail / par.size;
    const x     = cellX + (cellW - par.size) / 2;
    const y     = cellY + (cellH - par.size) / 2;

    par.el.style.zIndex    = 1;
    par.el.style.transform = `translate(${x}px, ${y}px) rotate(0deg) scale(${scale})`;
  });
}

/* ════ VIEWER ════ */
function openViewer(idx) {
  currentIndex = idx;
  renderViewer();
  document.getElementById('viewerOverlay').classList.add('open');
  document.body.classList.add('viewing');
  document.getElementById('hint').classList.add('hidden');
}

function renderViewer() {
  const p = PRINTS[currentIndex];
  document.getElementById('vImg').src  = p.img;
  document.getElementById('vImg').alt  = p.code;
  document.getElementById('vCode').textContent    = p.code;
  document.getElementById('vName').textContent    = p.name || p.code;
  document.getElementById('vCounter').textContent = `${currentIndex + 1} / ${PRINTS.length}`;
  const desc = document.getElementById('vDesc');
  desc.textContent    = p.desc || '';
  desc.style.display  = p.desc ? 'block' : 'none';
}

function closeViewer() {
  document.getElementById('viewerOverlay').classList.remove('open');
  document.body.classList.remove('viewing');
  currentIndex = -1;
  /* In grid mode, particles stay visible but dimmed was removed */
}

function navigate(dir) {
  currentIndex = (currentIndex + dir + PRINTS.length) % PRINTS.length;
  renderViewer();
}

/* Click outside viewer box to close */
document.getElementById('viewerOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('viewerOverlay')) closeViewer();
});

/* Keyboard */
document.addEventListener('keydown', e => {
  if (currentIndex < 0) return;
  if (e.key === 'Escape')      closeViewer();
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown')  navigate(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')    navigate(-1);
});

/* Hide hint after first click */
document.addEventListener('click', () => {
  document.getElementById('hint').classList.add('hidden');
}, { once: true });
</script>
</body>
</html>
